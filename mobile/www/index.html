<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ThabangVision</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #050505; color: #f2efe8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; gap: 16px; }
    h1 { font-size: 22px; margin: 0; letter-spacing: 0.02em; }
    p { margin: 0; max-width: 32ch; line-height: 1.5; color: #b9b4aa; }
    button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 6px; background: #D4A843; color: #050505; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>No connection</h1>
    <p>ThabangVision needs the internet to show creators, gear and your bookings. Check your data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.href='https://www.thabangvision.com'">Try again</button>
  </main>
</body>
</html>
