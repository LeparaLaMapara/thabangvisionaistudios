name: CI
on:
  push:
    branches: [main, develop, 'v2/**', 'v3/**', 'v4/**']
  pull_request:
    branches: [main, develop]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AI_PROVIDER: anthropic
  PAYMENT_PROVIDER: payfast
  STORAGE_PROVIDER: cloudinary
  EMAIL_PROVIDER: gmail
  SEARCH_PROVIDER: supabase
  RAG_ENABLED: "false"
  NEXT_PUBLIC_APP_URL: https://nonprodthabangvisionaistudios.vercel.app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          FOUND=0
          grep -rn "sk-ant-" --include="*.ts" --include="*.tsx" app/ lib/ components/ 2>/dev/null && FOUND=1 || true
          grep -rn "sk-proj-" --include="*.ts" --include="*.tsx" app/ lib/ components/ 2>/dev/null && FOUND=1 || true
          grep -rn "AIzaSy" --include="*.ts" --include="*.tsx" app/ lib/ components/ 2>/dev/null && FOUND=1 || true
          if [ $FOUND -eq 1 ]; then echo "❌ Hardcoded secrets found!"; exit 1; fi
          echo "✅ No hardcoded secrets"

      - name: No hardcoded business values in app/
        run: |
          echo "Checking for hardcoded business values..."
          FOUND=0
          grep -rn "079 539\|0795399012" --include="*.ts" --include="*.tsx" app/ components/ 2>/dev/null && FOUND=1 || true
          grep -rn "thabangvisionstudios@gmail" --include="*.ts" --include="*.tsx" app/ components/ 2>/dev/null && FOUND=1 || true
          if [ $FOUND -eq 1 ]; then echo "❌ Hardcoded business values found in app/ or components/"; exit 1; fi
          echo "✅ No hardcoded business values"

      - name: No direct SDK imports in app/
        run: |
          echo "Checking for direct SDK imports..."
          FOUND=0
          grep -rn "from '@anthropic-ai" --include="*.ts" --include="*.tsx" app/ 2>/dev/null && FOUND=1 || true
          grep -rn "from 'cloudinary'" --include="*.ts" --include="*.tsx" app/ 2>/dev/null && FOUND=1 || true
          grep -rn "from 'nodemailer'" --include="*.ts" --include="*.tsx" app/ 2>/dev/null && FOUND=1 || true
          if [ $FOUND -eq 1 ]; then echo "❌ Direct SDK imports found in app/ — use lib/ abstractions"; exit 1; fi
          echo "✅ No direct SDK imports in app/"

  # Rebuilds the whole schema from the repo (base schema + lib/migrations in
  # the canonical order) into an empty local Supabase and runs every SQL test.
  # Nothing here reaches a Supabase project: the scripts refuse any non-local
  # host. The Supabase project comes from .github/ci/supabase/ (empty
  # migrations folder), NOT the repo's supabase/ folder, whose stale
  # migrations `supabase start` would otherwise auto-apply.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI: supabase@2.120.0
      CI_DB_URL: postgresql://postgres:postgres@127.0.0.1:54422/postgres
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: psql client
        run: |
          command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql --version

      # Database + Auth + Storage only: the schema needs the auth.users columns
      # and storage.buckets/objects that gotrue and storage-api create.
      - name: Start local Supabase (db, auth, storage)
        run: >
          npx --yes "$SUPABASE_CLI" start --workdir .github/ci
          -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Rebuild schema (scripts/db/rebuild-local.sh)
        run: bash scripts/db/rebuild-local.sh "$CI_DB_URL"

      - name: SQL tests (scripts/db/run-sql-tests.sh)
        env:
          SQL_TEST_LOG_DIR: ${{ runner.temp }}/sql-test-logs
        run: bash scripts/db/run-sql-tests.sh "$CI_DB_URL"

      - name: Upload SQL test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sql-test-logs
          path: ${{ runner.temp }}/sql-test-logs
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: npx --yes "$SUPABASE_CLI" stop --workdir .github/ci --no-backup
