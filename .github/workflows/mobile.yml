name: Mobile app

# Builds and smoke-tests the Capacitor shell in mobile/.
# - Android: a debug APK on every change to mobile/, uploaded as an artifact
#   so it can be installed on a phone straight from the run page. On a manual
#   run (or with "device tests" ticked) the APK is also installed on an
#   Android emulator, launched, checked and screenshotted.
# - iOS: an unsigned simulator build, installed on an iPhone simulator,
#   launched and screenshotted. Manual runs only, because macOS minutes cost
#   ten times Linux minutes on a private repository.
# Store-signed builds (Play App Bundle, App Store archive) come later, once the
# signing keys and store accounts exist: see docs/mobile/README.md.

on:
  push:
    branches: [develop, main, 'feature/mobile-*']
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build and test iOS (uses macOS minutes)'
        type: boolean
        default: false
      device_tests:
        description: 'Run the Android emulator smoke test'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.thabangvision.app

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Unit tests (Gradle)
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: thabangvision-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Enable KVM for the emulator
        if: github.event_name == 'workflow_dispatch' && inputs.device_tests
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test (install, launch, check, screenshot)
        if: github.event_name == 'workflow_dispatch' && inputs.device_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile
          script: bash scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.device_tests
        with:
          name: android-smoke
          path: mobile/smoke-android/
          retention-days: 14

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the simulator (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Simulator smoke test (install, launch, check, screenshot)
        run: bash scripts/ios-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: mobile/smoke-ios/
          retention-days: 14
