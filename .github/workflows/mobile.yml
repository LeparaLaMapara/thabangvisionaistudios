name: Mobile app

# Builds the Capacitor shell in mobile/.
# - Android: a debug APK on every change to mobile/, uploaded as an artifact
#   so it can be installed on a phone straight from the run page.
# - iOS: an unsigned simulator build, run by hand only (Actions tab, "Run
#   workflow"), because macOS minutes cost ten times Linux minutes on a
#   private repository.
# Store-signed builds (Play App Bundle, App Store archive) come later, once the
# signing keys and store accounts exist: see docs/mobile/README.md.

on:
  push:
    branches: [develop, main, 'feature/mobile-*']
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build iOS (simulator, unsigned, uses macOS minutes)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: thabangvision-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the simulator (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
